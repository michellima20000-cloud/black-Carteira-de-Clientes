name: black-carteira-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: black_carteira
      POSTGRES_PASSWORD: black_carteira_test
      POSTGRES_DB: black_carteira_test
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U black_carteira -d black_carteira_test']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
